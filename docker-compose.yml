services:
  screener:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite DB across container restarts/rebuilds.
      - screener_data:/app/backend/data
      # The repo's own data files, read-only: `git pull` on the host followed by
      # /app/sync-data.sh in the container deploys new data with no rebuild/restart.
      - ./backend/data:/app/backend/data-live:ro
    # Everything else (ADMIN_EMAIL, GH_DISPATCH_TOKEN, NEWSDATA_API_KEY,
    # CRON_KEY, ...) comes from .env in this same directory -- copy
    # .env.example to .env and fill in what you need; it's gitignored.
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/screener.db}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    restart: unless-stopped

volumes:
  screener_data:
