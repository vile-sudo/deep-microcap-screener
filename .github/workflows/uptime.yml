name: Uptime check

# Every 10 minutes: is the live dashboard answering? Two jobs in one:
#   * keeps a free Render instance from going to sleep (it sleeps after 15
#     minutes without traffic, and the first visitor then waits ~a minute);
#   * notices when the site is really down. A cold start can take a minute,
#     so it retries for about three minutes before failing -- and a failed
#     scheduled run makes GitHub email the repo owner.

permissions:
  contents: read

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check /healthz
        env:
          SITE: https://deep-microcap-screener.onrender.com
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o body.txt -w '%{http_code}' -m 40 "$SITE/healthz" || echo 000)
            echo "attempt $i: HTTP $code $(cat body.txt 2>/dev/null)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::$SITE has not answered /healthz for about three minutes"
          exit 1
