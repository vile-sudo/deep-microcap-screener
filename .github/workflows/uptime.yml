name: Uptime check

# Every 10 minutes: is the live dashboard (pkresearch.in, behind Caddy)
# answering? Retries for about three minutes before failing, and a failed
# scheduled run makes GitHub email the repo owner.
#
# Caddy sits in front of the app and answers 401 to anyone without the site
# login -- even /healthz -- so 401 is treated as "up" here. That proves the
# server and Caddy are reachable (a dead host, or a TLS/DNS failure, still
# fails), but not that the app container behind Caddy is healthy.

permissions:
  contents: read

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check /healthz
        env:
          SITE: https://pkresearch.in
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o body.txt -w '%{http_code}' -m 40 "$SITE/healthz" || echo 000)
            echo "attempt $i: HTTP $code $(cat body.txt 2>/dev/null)"
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::$SITE has not answered /healthz for about three minutes"
          exit 1
