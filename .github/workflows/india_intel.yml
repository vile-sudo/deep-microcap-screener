name: India results and guidance

# The India scorecard's "Quarterly results" and "Management guidance tracker" sections, refreshed every
# morning (after the news and US jobs). Two steps, in order:
#   1. scripts/run_results_in.py   each board company's last 12 quarters and 8 fiscal years of sales, margin and
#      profit, plus its earnings-call list, from its public screener.in page (~455 companies, ~20 minutes);
#   2. scripts/run_guidance_in.py  reads the newest unread earnings-call transcripts (BSE/NSE filings), pulls out the
#      numeric targets management stated, and re-checks every target against the reported results. At most
#      --budget transcripts a run, newest first, so the ~455 companies fill in over about a week; afterwards a run
#      reads only the calls that appeared since (a handful) and re-verifies.
# A file is committed only when its content changed. Polite pacing; if screener.in refuses requests the run
# stops and keeps what it has. Commits with GITHUB_TOKEN never re-trigger workflows.

permissions:
  contents: write

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Most new transcripts to read this run'
        required: false
        default: '150'

concurrency:
  group: india-intel
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pypdf

      - name: Quarterly and annual results (screener.in)
        working-directory: ./backend
        run: python -u scripts/run_results_in.py

      - name: Read earnings-call transcripts and check management's targets
        working-directory: ./backend
        env:
          BUDGET: ${{ github.event.inputs.budget || '150' }}
        run: python -u scripts/run_guidance_in.py --budget "$BUDGET"

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/results_in backend/data/guidance_in
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "India results and guidance update"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Data-only deploy: pull on the server and copy the new data files into the running container
      # (no rebuild, no restart); a full rebuild only if the container predates /app/sync-data.sh.
      - name: Deploy to AWS
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "AWS_HOST/AWS_SSH_KEY secrets not set; skipping AWS deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
            "flock /tmp/screener-deploy.lock sh -c 'cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && (docker compose exec -T screener test -x /app/sync-data.sh && docker compose exec -T screener /app/sync-data.sh || docker compose up -d --build)'"
          echo "AWS data deploy done"
