name: Chart gallery update

# Keeps the Chart gallery and Market view's stage screen (chart_data/setups.json)
# current with no one touching it:
#   * every morning as step 5 of daily.yml (02:00 IST), so every chart
#     gains the previous session's candle;
#   * whenever the board's company list changes, so a company added to the
#     board gets its chart (with as much history as the exchanges have) within
#     minutes.
# Commits by this workflow use GITHUB_TOKEN, which never re-triggers
# workflows, so the push trigger cannot loop.

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - backend/data/companies_raw.json
  workflow_dispatch:

concurrency:
  group: chart-gallery
  cancel-in-progress: false

jobs:
  update-charts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # Years of daily exchange files (back to about January 2020, as far as
      # real NSE/BSE data goes). A cache hit means only the newest day is
      # downloaded; a full miss backfills everything, which is slow the very
      # first time and quick on every run after.
      - name: Restore bhavcopy cache
        uses: actions/cache@v4
        with:
          path: backend/.bhav_cache
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-

      - name: Build charts
        working-directory: ./backend
        run: python scripts/update_charts.py

      # Screen any Chart covers every actively traded NSE/BSE company, which is
      # a few hundred MB of candles rewritten nightly -- far too much to commit.
      # It rides in a release asset instead; app/universe.py fetches it once per
      # server. Only the small search index (chart_data/universe.json) is
      # committed, so searching still works even if this upload fails.
      - name: Publish universe charts
        id: universe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d backend/universe_charts ]; then echo "no universe charts built"; exit 0; fi
          tar -czf universe-charts.tar.gz -C backend/universe_charts .
          ls -lh universe-charts.tar.gz
          gh release view charts > /dev/null 2>&1 || gh release create charts --title "Chart data" \
            --notes "Daily candles and base analysis for every actively traded NSE/BSE company, used by Screen any Chart. Rebuilt nightly; not investment advice."
          gh release upload charts universe-charts.tar.gz --clobber

      - name: Commit chart data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/chart_data
          if git diff --cached --quiet; then
            echo "No chart changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Chart gallery update"
          # the daily screener run may have pushed in the meantime
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set; skipping deploy"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-delay 5 -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render deploy triggered"

      - name: Deploy to AWS
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "AWS_HOST/AWS_SSH_KEY secrets not set; skipping AWS deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
            "cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && docker compose up -d --build"
          echo "AWS deploy triggered"
