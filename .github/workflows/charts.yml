name: Chart gallery update

# Keeps the Chart gallery and Market view's stage screen (chart_data/setups.json)
# current with no one touching it:
#   * every morning as step 5 of daily.yml (02:00 IST), so every chart
#     gains the previous session's candle;
#   * whenever the board's company list changes, so a company added to the
#     board gets its chart (with as much history as the exchanges have) within
#     minutes.
# Commits by this workflow use GITHUB_TOKEN, which never re-triggers
# workflows, so the push trigger cannot loop.

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - backend/data/companies_raw.json
  workflow_dispatch:

concurrency:
  group: chart-gallery
  cancel-in-progress: false

jobs:
  update-charts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # Years of daily exchange files (back to about January 2020, as far as
      # real NSE/BSE data goes). A cache hit means only the newest day is
      # downloaded; a full miss backfills everything, which is slow the very
      # first time and quick on every run after.
      - name: Restore bhavcopy cache
        uses: actions/cache@v4
        with:
          path: backend/.bhav_cache
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-

      - name: Build charts
        working-directory: ./backend
        run: python scripts/update_charts.py

      - name: Commit chart data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/chart_data
          if git diff --cached --quiet; then
            echo "No chart changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Chart gallery update"
          # the daily screener run may have pushed in the meantime
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set; skipping deploy"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-delay 5 -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render deploy triggered"
