name: Deploy code

# Code changes reach the server by themselves: pushing anything that changes what the
# container RUNS (the API, the front end, the image, the compose file) pulls it onto the
# AWS box and rebuilds. Until now only the scheduled data jobs deployed, and those ran
# the same command as a side effect, so a code fix could sit on GitHub for hours.
#
# Data-only commits from the scheduled jobs use GITHUB_TOKEN and never trigger this, and
# they deploy on their own (data-only, no rebuild, for the frequent ones). Skipped, with
# a note, when the AWS_HOST / AWS_SSH_KEY secrets are not set. Also runnable by hand.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - backend/app/**
      - backend/requirements.txt
      - backend/Dockerfile
      - backend/*.sh
      - frontend/**
      - docker-compose.yml
  workflow_dispatch:

concurrency:
  group: deploy-code
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pull and rebuild on the server
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "AWS_HOST/AWS_SSH_KEY secrets not set; skipping the deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
            "cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && docker compose up -d --build"
          echo "Deployed"
