name: US analytics update

# The research data behind the US scorecard, refreshed every morning after the auto-screen
# (05:00 UTC), the news job and the 13F check (08:30 UTC). One job, each step independent
# (a failure in one never blocks the others):
#   1. financial trend     SEC XBRL, five fiscal years          (scripts/run_fundamentals_us.py)
#   2. analyst coverage    Finnhub free tier                    (scripts/run_analysts_us.py)
#   3. short interest      FINRA bi-monthly files, no key       (scripts/run_short_us.py)
#   4. IPO calendar        Finnhub free tier                    (scripts/run_ipo_us.py)
#   5. performance         return since added + score history   (scripts/run_performance_us.py)
# Needs the FINNHUB_API_KEY repo secret for 2, 4 and 5 (5 falls back to chart/board prices
# without it). Also runs whenever the US board's company list changes, so a company added
# today has its data today. Commits with GITHUB_TOKEN never re-trigger workflows.

permissions:
  contents: write

on:
  schedule:
    - cron: '45 8 * * *'
  push:
    branches: [main]
    paths:
      - backend/data/companies_us_raw.json
  workflow_dispatch:

concurrency:
  group: us-analytics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Financial trend (SEC XBRL)
        continue-on-error: true
        working-directory: ./backend
        run: python scripts/run_fundamentals_us.py

      - name: Analyst coverage
        continue-on-error: true
        working-directory: ./backend
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/run_analysts_us.py

      - name: Short interest (FINRA)
        continue-on-error: true
        working-directory: ./backend
        run: python scripts/run_short_us.py

      - name: IPO calendar
        continue-on-error: true
        working-directory: ./backend
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/run_ipo_us.py

      - name: Performance since added and score history
        continue-on-error: true
        working-directory: ./backend
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/run_performance_us.py

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/fundamentals_us backend/data/analysts_us backend/data/short_us backend/data/ipo_us backend/data/performance_us
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "US analytics update"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Data-only deploy: pull on the server and copy the new data files into the running
      # container (no rebuild, no restart); a full rebuild only if the container predates
      # /app/sync-data.sh.
      - name: Deploy to AWS
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "AWS_HOST/AWS_SSH_KEY secrets not set; skipping AWS deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
            "flock /tmp/screener-deploy.lock sh -c 'cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && (docker compose exec -T screener test -x /app/sync-data.sh && docker compose exec -T screener /app/sync-data.sh || docker compose up -d --build)'"
          echo "AWS data deploy done"
