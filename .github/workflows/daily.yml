name: Daily 2 AM update

# The whole dashboard, refreshed once every night at about 02:00 IST -- while
# the owner sleeps, so a fresh Claude usage session is available by morning
# (GitHub can start scheduled runs 5-20 minutes late). One job, in order:
#
#   1. fundamentals   price, market cap, P/E, ROCE, ROE and holdings for every
#                     board company, from screener.in   (scripts/refresh_data.py)
#   1b. deals         NSE's own bulk & block deals report, accumulated into a
#                     rolling 120-day history                (scripts/run_deals.py)
#   1c. announcements NSE's own corporate announcements, classified and
#                     accumulated into a rolling 45-day history
#                                                       (scripts/run_announcements.py)
#   2. discovery      new NSE / BSE / SME listings and their prospectuses ->
#                     the Candidates queue               (automation/update-weekly.mjs)
#   3. auto-screen    checks listed companies against the board's gates and
#                     moat-evidence rules and adds the best 5-10 that pass,
#                     marked "Auto-added"               (scripts/auto_screen.py)
#   4. ASME           certificate directory scan        (automation/scan-asme.mjs)
#   5. charts         yesterday's candles, Chart gallery and Market view
#                     stages -- after step 3, so a company added today has
#                     its chart today                   (scripts/update_charts.py)
#   6. sector research  a new monthly edition for each sector in Sector
#                     Research, once a month            (scripts/sector_research.py)
#   7. sector numbers screener.in numbers for the companies in each sector
#                     report, every day                  (scripts/sector_numbers.py)
#      + latest       a short news check per sector: dated, cited "Latest
#                     developments" at the top of each report (scripts/sector_latest.py)
#   8. deep-dive      quarterly research reports for companies that filed
#                     new results (a few a day)         (scripts/deep_reports.py)
#   8b. IPO reports   mainboard/SME IPO research reports, written as soon as
#                     an issue opens for subscription    (scripts/ipo_reports.py)
#   9. report PDFs    printed from the dashboard's report page and uploaded
#                     to the "reports" release          (automation/render-report-pdfs.mjs)
#  10. one commit, one Render deploy
#
# A stage that fails is reported but doesn't stop the rest: every script
# writes nothing when its source is broken, so the board keeps yesterday's
# data for that part. The run is marked failed at the end (GitHub then emails
# the repo owner) if any stage failed.
#
# Every stage also has its own workflow for running by hand.
#
# Movers (every NSE stock that closed 4%+ up or down, with why) is not a step
# here: it runs on its own schedule, 07:00 IST, in movers.yml. That is later
# than this 02:00 IST run on purpose -- news of yesterday's move is often
# published the next morning, and Movers makes no use of the Claude Max plan
# this run is paced around, so there is nothing to gain by running it early.

permissions:
  contents: write

on:
  schedule:
    - cron: '30 20 * * *'      # 02:00 IST, every day (20:30 UTC the previous day)
  workflow_dispatch:
    inputs:
      max_add:
        description: 'Most companies the auto-screen may add'
        required: false
        default: '10'

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils unzip
          pip install -r backend/requirements.txt beautifulsoup4 anthropic
          cd automation
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: Restore bhavcopy cache
        uses: actions/cache@v4
        with:
          path: backend/.bhav_cache
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-

      - name: 1. Fundamentals refresh
        id: fundamentals
        continue-on-error: true
        timeout-minutes: 50
        working-directory: ./backend
        run: python scripts/refresh_data.py

      - name: 1b. Bulk & Block Deals
        id: deals
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ./backend
        run: python scripts/run_deals.py

      - name: 1c. Corporate announcements
        id: announcements
        continue-on-error: true
        timeout-minutes: 20
        working-directory: ./backend
        run: python scripts/run_announcements.py

      - name: 2. Discovery scan
        id: discovery
        continue-on-error: true
        timeout-minutes: 60
        working-directory: ./automation
        # exits 1 when any sub-step fails, including one unreadable prospectus
        # out of dozens; the listings and queue are still written, so warn only
        run: node update-weekly.mjs --no-asme || echo "::warning::discovery finished with some failed sub-steps (see automation/data/last-run.json)"

      - name: 3. Auto-screen new companies
        id: autoscreen
        continue-on-error: true
        timeout-minutes: 60
        working-directory: ./backend
        env:
          MAX_ADD: ${{ github.event.inputs.max_add || '10' }}
        run: python scripts/auto_screen.py --max-add "$MAX_ADD" --budget 400

      - name: 4. ASME certification scan
        id: asme
        continue-on-error: true
        timeout-minutes: 40
        working-directory: ./automation
        run: node scan-asme.mjs

      - name: 5. Charts and Market view stages
        id: charts
        continue-on-error: true
        timeout-minutes: 90   # the one-time multi-year bhavcopy backfill is slow; incremental runs after that are quick
        working-directory: ./backend
        run: python scripts/update_charts.py

      # Screen any Chart's charts for every actively traded NSE/BSE company:
      # too big to commit, so they ride in a release asset (see charts.yml)
      - name: 5b. Publish universe charts
        id: universe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d backend/universe_charts ]; then echo "no universe charts built"; exit 0; fi
          tar -czf universe-charts.tar.gz -C backend/universe_charts .
          ls -lh universe-charts.tar.gz
          gh release view charts > /dev/null 2>&1 || gh release create charts --title "Chart data"             --notes "Daily candles and base analysis for every actively traded NSE/BSE company, used by Screen any Chart. Rebuilt nightly; not investment advice."
          gh release upload charts universe-charts.tar.gz --clobber

      # Monthly sector research editions, written by Claude Code with web search on
      # the owner's Claude Max plan. Does nothing unless a sector's edition for this
      # month is missing (normally the 1st), and runs before the deep-dive reports so
      # the monthly session gets the day's usage first. SECTORS_PER_RUN (default 1)
      # caps how many sectors are written in one day; the rest follow on later days.
      - name: 6. Sector research (monthly)
        id: sectors
        continue-on-error: true
        timeout-minutes: 170
        working-directory: ./backend
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SECTORS_PER_RUN: ${{ vars.SECTORS_PER_RUN || '1' }}
          SECTOR_SESSION_MINUTES: '75'
        run: python scripts/sector_research.py

      - name: 7. Sector company numbers
        id: sectornums
        continue-on-error: true
        timeout-minutes: 20
        working-directory: ./backend
        run: python scripts/sector_numbers.py

      # A short Claude Code session per sector (Sonnet by default, to save the plan's
      # usage for the deep-dive reports): news since the last check, each item cited.
      - name: 7b. Sector latest developments
        id: sectorlatest
        continue-on-error: true
        timeout-minutes: 45
        working-directory: ./backend
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SECTOR_LATEST_MODEL: ${{ vars.SECTOR_LATEST_MODEL || 'sonnet' }}
          SECTOR_LATEST_MINUTES: '20'
          SECTOR_LATEST_COUNT_FILE: ../sector-latest-count.txt
        run: python scripts/sector_latest.py

      # Quarterly deep-dive reports: a small batch a day, as companies file
      # results, written by Claude Code on the owner's Claude Max plan. Off until
      # the CLAUDE_CODE_OAUTH_TOKEN secret exists (create it with `claude setup-token`).
      # Optional repo variables: REPORTS_PER_DAY (default 2), REPORT_MODEL (default opus),
      # REPORT_ENGINE=api to use a paid ANTHROPIC_API_KEY instead.
      - name: 8. Deep-dive reports
        id: reports
        continue-on-error: true
        timeout-minutes: 200
        working-directory: ./backend
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPORT_ENGINE: ${{ vars.REPORT_ENGINE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
          REPORTS_PER_DAY: ${{ vars.REPORTS_PER_DAY }}
          REPORT_MAX_COST_USD: ${{ vars.REPORT_MAX_COST_USD }}
          REPORT_PRICE_IN: ${{ vars.REPORT_PRICE_IN }}
          REPORT_PRICE_OUT: ${{ vars.REPORT_PRICE_OUT }}
        run: |
          if [ -z "$REPORT_MODEL" ]; then unset REPORT_MODEL; fi
          if [ -z "$REPORTS_PER_DAY" ]; then unset REPORTS_PER_DAY; fi
          if [ -z "$REPORT_ENGINE" ]; then unset REPORT_ENGINE; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then unset ANTHROPIC_API_KEY; fi
          python scripts/deep_reports.py --out-list ../reports-today.txt

      - name: 8b. Upcoming IPO reports
        id: iporeports
        continue-on-error: true
        timeout-minutes: 150   # deeper reports now (SESSION_MINUTES=75/attempt, up to 3 attempts, up to 4 issues a run)
        working-directory: ./backend
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/ipo_reports.py

      - name: 9. Report PDFs
        id: pdfs
        continue-on-error: true
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s reports-today.txt ]; then echo "No new reports today"; exit 0; fi
          cd backend
          python -m app.seed > /dev/null
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8799 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8799/healthz > /dev/null && break; sleep 1; done
          cd ../automation
          node render-report-pdfs.mjs --base http://127.0.0.1:8799 --list ../reports-today.txt --out ../reports-pdf
          cd ..
          if ls reports-pdf/*.pdf > /dev/null 2>&1; then
            gh release view reports > /dev/null 2>&1 || gh release create reports --title "Deep-dive report PDFs" \
              --notes "PDFs of the dashboard's quarterly deep-dive research reports, uploaded by the daily workflow. Not investment advice."
            gh release upload reports reports-pdf/*.pdf --clobber
          fi

      - name: 10. Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/companies_raw.json backend/data/candidates_raw.json backend/data/build_stamp.json \
                  backend/data/asme_raw.json backend/data/deals backend/data/announcements backend/chart_data \
                  automation/data/candidates-queue.json automation/data/reviewed-symbols.json \
                  automation/data/listings-snapshot.json automation/data/asme-scan.json
          for f in automation/data/auto-screen.json automation/data/weekly-report.md automation/data/profiles \
                   backend/reports backend/sectors automation/data/deep-reports.json \
                   backend/data/ipo_reports automation/data/ipo-reports.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          added=$(python -c "import json;r=json.load(open('automation/data/auto-screen.json'))['runs'][-1];print(len(r.get('added_codes',[])))" 2>/dev/null || echo 0)
          reports=$(grep -c . reports-today.txt 2>/dev/null || echo 0)
          sectors=$(git diff --cached --name-only -- 'backend/sectors/*/????-??.json' | wc -l)
          news=$(cat sector-latest-count.txt 2>/dev/null || echo 0)
          git commit -m "Daily update $(TZ=Asia/Kolkata date +%F): ${added} auto-added, ${reports} deep-dive reports, ${sectors} sector editions, ${news} sector developments"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set; skipping deploy"; exit 0; fi
          curl -fsSL --retry 3 --retry-delay 5 -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render deploy triggered"

      - name: Deploy to AWS
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "AWS_HOST/AWS_SSH_KEY secrets not set; skipping AWS deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
            "cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && docker compose up -d --build"
          echo "AWS deploy triggered"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Daily update"
            echo "| stage | result |"
            echo "|---|---|"
            echo "| fundamentals | ${{ steps.fundamentals.outcome }} |"
            echo "| deals | ${{ steps.deals.outcome }} |"
            echo "| announcements | ${{ steps.announcements.outcome }} |"
            echo "| discovery | ${{ steps.discovery.outcome }} |"
            echo "| auto-screen | ${{ steps.autoscreen.outcome }} |"
            echo "| ASME | ${{ steps.asme.outcome }} |"
            echo "| charts | ${{ steps.charts.outcome }} |"
            echo "| universe charts | ${{ steps.universe.outcome }} |"
            echo "| sector research | ${{ steps.sectors.outcome }} |"
            echo "| sector numbers | ${{ steps.sectornums.outcome }} |"
            echo "| sector latest developments | ${{ steps.sectorlatest.outcome }} |"
            echo "| deep-dive reports | ${{ steps.reports.outcome }} |"
            echo "| IPO reports | ${{ steps.iporeports.outcome }} |"
            echo "| report PDFs | ${{ steps.pdfs.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s reports-today.txt ]; then { echo; echo "Deep-dive reports written:"; sed 's/^/- /' reports-today.txt; } >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f automation/data/auto-screen.json ]; then
            python -c "import json;r=json.load(open('automation/data/auto-screen.json'))['runs'][-1];print('\nAuto-screen:', r)" >> "$GITHUB_STEP_SUMMARY"
          fi
          failed=""
          for o in "${{ steps.fundamentals.outcome }}" "${{ steps.deals.outcome }}" "${{ steps.announcements.outcome }}" "${{ steps.discovery.outcome }}" "${{ steps.autoscreen.outcome }}" "${{ steps.asme.outcome }}" "${{ steps.charts.outcome }}" "${{ steps.sectors.outcome }}" "${{ steps.sectornums.outcome }}" "${{ steps.sectorlatest.outcome }}" "${{ steps.reports.outcome }}" "${{ steps.iporeports.outcome }}" "${{ steps.pdfs.outcome }}"; do
            if [ "$o" = "failure" ]; then failed=1; fi
          done
          if [ -n "$failed" ]; then echo "::error::a stage failed -- see the table above"; exit 1; fi
