name: Results evening read

# Results Preview's overnight read (app/results_preview.py): most companies file quarterly results after the
# 3:30 PM close, so the numbers are public hours before the next open. This re-runs just that slice the same
# evening -- today's filings (scripts/run_announcements.py), the numbers of companies that just reported
# (scripts/run_results_universe.py, just-reported first), then the read itself -- so the "Just reported" tab
# and the bell's "Overnight result read" alerts are ready the evening a company reports, not only after
# daily.yml's 02:00 IST run (which repeats all of this).
#
# Two times, as deals_evening.yml does: 21:30 IST catches the 4-8 PM filings, 23:30 IST the late ones (and
# covers a dropped schedule). Commits use GITHUB_TOKEN, which never re-triggers workflows.

permissions:
  contents: write

on:
  schedule:
    - cron: '0 16 * * *'       # 21:30 IST
    - cron: '0 18 * * *'       # 23:30 IST
  workflow_dispatch:

concurrency:
  group: results-evening
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt beautifulsoup4 pypdf scikit-learn numpy

      - name: Today's filings
        continue-on-error: true
        working-directory: ./backend
        run: python scripts/run_announcements.py

      - name: Numbers of companies that just reported
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ./backend
        run: python scripts/run_results_universe.py --budget 150

      - name: Overnight read
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ./backend
        run: python scripts/run_results_preview.py

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/announcements backend/data/results_universe backend/data/results_preview
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Results evening read"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Data-only, same as deals_evening.yml: sync-data.sh picks the new files up without a restart, and the
      # desktop push loop polls the alerts feed every minute.
      - name: Deploy to AWS
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "AWS_HOST/AWS_SSH_KEY secrets not set; skipping AWS deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
            "flock /tmp/screener-deploy.lock sh -c 'cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && (docker compose exec -T screener test -x /app/sync-data.sh && docker compose exec -T screener /app/sync-data.sh || docker compose up -d --build)'"
          echo "AWS data deploy done"
