name: Results evening read

# Results Preview's overnight read (app/results_preview.py): most companies file quarterly results after the
# 3:30 PM close, so the numbers are public hours before the next open. This re-runs just that slice the same
# evening -- today's filings (scripts/run_announcements.py), the numbers of companies that just reported
# (scripts/run_results_universe.py, just-reported first), then the read itself -- so the "Just reported" tab
# and the bell's "Overnight result read" alerts are ready the evening a company reports, not only after
# daily.yml's 02:00 IST run (which repeats all of this).
#
# Several times through the night (see the schedule): the first catches the 4-8 PM filings, later ones the late
# filings and any run GitHub delayed or dropped. Commits use GITHUB_TOKEN, which never re-triggers workflows.

permissions:
  contents: write

on:
  # Five runs so the read is there before the 9:15 AM open even when GitHub starts scheduled jobs hours late
  # (it often does; off-the-hour minutes are delayed less). Each run is cheap and only commits what changed;
  # the 07:47 run is the last catch-up before the open.
  schedule:
    - cron: '17 16 * * *'      # 21:47 IST
    - cron: '47 17 * * *'      # 23:17 IST
    - cron: '17 20 * * *'      # 01:47 IST
    - cron: '47 23 * * *'      # 05:17 IST
    - cron: '17 2 * * *'       # 07:47 IST
  workflow_dispatch:

concurrency:
  group: results-evening
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt beautifulsoup4 pypdf scikit-learn numpy anthropic

      - name: Today's filings
        continue-on-error: true
        working-directory: ./backend
        run: python scripts/run_announcements.py

      - name: Numbers of companies that just reported
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ./backend
        run: python scripts/run_results_universe.py --budget 150

      # Claude reads each new results PDF (Message Batches API); a batch not finished in ~12 minutes is collected
      # by the next run. Needs the ANTHROPIC_API_KEY secret; skips without it.
      - name: Claude's read of the filings
        continue-on-error: true
        timeout-minutes: 30
        working-directory: ./backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESULTS_READ_MODEL: ${{ vars.RESULTS_READ_MODEL || 'claude-opus-5-5' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then unset ANTHROPIC_API_KEY; fi
          python scripts/run_results_read.py --wait 12

      - name: Overnight read
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ./backend
        run: python scripts/run_results_preview.py

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/announcements backend/data/results_universe backend/data/results_preview backend/data/results_read
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Results evening read"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Data-only, same as deals_evening.yml: sync-data.sh picks the new files up without a restart, and the
      # desktop push loop polls the alerts feed every minute.
      - name: Deploy to AWS
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "AWS_HOST/AWS_SSH_KEY secrets not set; skipping AWS deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
            "flock /tmp/screener-deploy.lock sh -c 'cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && (docker compose exec -T screener test -x /app/sync-data.sh && docker compose exec -T screener /app/sync-data.sh || docker compose up -d --build)'"
          echo "AWS data deploy done"
