name: Movers scan

# Keeps the Movers page current with no one touching it: on its own schedule
# at 07:00 IST every morning -- separately from daily.yml's 02:00 IST run,
# and on purpose. News coverage of yesterday's move is often published the
# next morning, so scanning at 07:00 (about 15.5 hours after the 15:30 close)
# catches far more of it than scanning at 02:00 (about 10.5 hours after)
# would. This scan makes no use of the Claude Max plan daily.yml is paced
# around, so running it later costs nothing there.
#
# Also runs on demand: an admin clicking "Run tonight's scan now" on the
# dashboard (POST /api/admin/movers/run-now, see app/routers/movers.py), or
# this workflow run by hand from the Actions tab.
#
# Commits by this workflow use GITHUB_TOKEN, which never re-triggers
# workflows, so nothing here can loop.
#
# Two schedule times, not one: GitHub documents that a `schedule` trigger can
# be delayed or, during high platform load, dropped entirely, with no retry
# of its own -- and this already happened once (07:00 IST silently did not
# fire on 2026-09-18). 10:00 IST re-runs the same day's scan as a backup; if
# 07:00 already succeeded this is a genuine no-op (run_movers.py overwrites
# the same date's file with nothing new to say, and the commit step's
# `git diff --cached --quiet` check skips the commit and the deploy).

permissions:
  contents: write

on:
  schedule:
    - cron: '30 1 * * *'      # 07:00 IST, every day (01:30 UTC)
    - cron: '30 4 * * *'      # 10:00 IST backup, in case 07:00 was dropped (04:30 UTC)
  workflow_dispatch:
    inputs:
      date:
        description: 'Trading date to scan as YYYY-MM-DD (blank: the most recently settled session)'
        required: false

concurrency:
  group: movers-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Every flagged move gets a news search (one request each, politely
    # paced), and a busy session across the whole NSE universe can flag
    # several hundred -- comfortable headroom for that, not a normal runtime.
    timeout-minutes: 120

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run the scan
        working-directory: ./backend
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/run_movers.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/run_movers.py
          fi

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/movers
          if git diff --cached --quiet; then
            echo "No movers changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Movers scan"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to AWS
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "AWS_HOST/AWS_SSH_KEY secrets not set; skipping AWS deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
            "flock /tmp/screener-deploy.lock sh -c 'cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && docker compose up -d --build'"
          echo "AWS deploy triggered"
