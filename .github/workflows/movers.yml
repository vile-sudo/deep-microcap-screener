name: Movers scan

# Keeps the Movers page current with no one touching it: on its own schedule
# at 07:00 IST every morning -- separately from daily.yml's 02:00 IST run,
# and on purpose. News coverage of yesterday's move is often published the
# next morning, so scanning at 07:00 (about 15.5 hours after the 15:30 close)
# catches far more of it than scanning at 02:00 (about 10.5 hours after)
# would. This scan makes no use of the Claude Max plan daily.yml is paced
# around, so running it later costs nothing there.
#
# Also runs on demand: an admin clicking "Run tonight's scan now" on the
# dashboard (POST /api/admin/movers/run-now, see app/routers/movers.py), or
# this workflow run by hand from the Actions tab.
#
# Commits by this workflow use GITHUB_TOKEN, which never re-triggers
# workflows, so nothing here can loop.

permissions:
  contents: write

on:
  schedule:
    - cron: '30 1 * * *'      # 07:00 IST, every day (01:30 UTC)
  workflow_dispatch:
    inputs:
      date:
        description: 'Trading date to scan as YYYY-MM-DD (blank: the most recently settled session)'
        required: false

concurrency:
  group: movers-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Every flagged move gets a news search (one request each, politely
    # paced), and a busy session across the whole NSE universe can flag
    # several hundred -- comfortable headroom for that, not a normal runtime.
    timeout-minutes: 120

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run the scan
        working-directory: ./backend
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/run_movers.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/run_movers.py
          fi

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/movers
          if git diff --cached --quiet; then
            echo "No movers changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Movers scan"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set; skipping deploy"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-delay 5 -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render deploy triggered"
