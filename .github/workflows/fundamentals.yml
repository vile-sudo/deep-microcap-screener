name: Company fundamentals refresh

# Runs every morning as step 1 of daily.yml; this workflow is for a manual
# re-run (optionally of a few codes). Re-pulls the numbers that move every week -- price, market cap, P/E, ROCE,
# ROE, promoter / FII / DII / public holding -- for every company on the
# board from its public screener.in page (backend/scripts/refresh_data.py,
# two seconds between companies). The research itself (scores, moat notes,
# risk notes) is never touched. If screener.in blocks the run or changes its
# page, the script writes nothing and the run fails, so stale-but-correct
# numbers are never replaced by broken ones.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'Only these company codes, comma-separated (blank = all)'
        required: false
        default: ''

concurrency:
  group: fundamentals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Refresh from screener.in
        working-directory: ./backend
        env:
          CODES: ${{ github.event.inputs.codes }}
        run: |
          if [ -n "$CODES" ]; then
            python scripts/refresh_data.py --codes "$CODES"
          else
            python scripts/refresh_data.py
          fi

      - name: Commit refreshed numbers
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/companies_raw.json
          if git diff --cached --quiet; then
            echo "No numbers changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Weekly fundamentals refresh"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to AWS
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "AWS_HOST/AWS_SSH_KEY secrets not set; skipping AWS deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
            "flock /tmp/screener-deploy.lock sh -c 'cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && docker compose up -d --build'"
          echo "AWS deploy triggered"
