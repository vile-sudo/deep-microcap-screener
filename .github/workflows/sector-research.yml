name: Sector research (by hand)

# Writes a sector's latest developments or its monthly research edition with Claude Code on the owner's Claude Max
# plan (CLAUDE_CODE_OAUTH_TOKEN secret), refreshes the sector company numbers,
# commits and deploys. The daily workflow does the same once a month on its own.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'What to run'
        type: choice
        options: ['latest developments', 'monthly edition']
        default: 'latest developments'
      sector:
        description: 'Sector slug (blank = every sector whose edition for this month is missing)'
        required: false
        default: ''
      force:
        description: 'Run even if already done today / this month'
        type: boolean
        default: false

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  sectors:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install -r backend/requirements.txt beautifulsoup4
          npm install -g @anthropic-ai/claude-code
      - name: Sector latest developments
        if: ${{ github.event.inputs.job == 'latest developments' }}
        working-directory: ./backend
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SECTOR_LATEST_MODEL: ${{ vars.SECTOR_LATEST_MODEL || 'sonnet' }}
          SECTOR: ${{ github.event.inputs.sector }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args=()
          if [ -n "$SECTOR" ]; then args+=(--sector "$SECTOR"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/sector_latest.py "${args[@]}"
      - name: Sector research
        if: ${{ github.event.inputs.job == 'monthly edition' }}
        working-directory: ./backend
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SECTORS_PER_RUN: ${{ vars.SECTORS_PER_RUN || '1' }}
          SECTOR: ${{ github.event.inputs.sector }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args=()
          if [ -n "$SECTOR" ]; then args+=(--sector "$SECTOR"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/sector_research.py "${args[@]}"
      - name: Sector company numbers
        working-directory: ./backend
        run: python scripts/sector_numbers.py
      - name: Commit and deploy
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sectors
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Sector research update $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
          if [ -n "$AWS_HOST" ] && [ -n "$AWS_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
              "cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && docker compose up -d --build"
            echo "AWS deploy triggered"
          fi
