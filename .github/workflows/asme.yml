name: ASME certification scan

# Runs every morning as step 4 of daily.yml; this workflow is for a manual
# re-run. A pass over ASME's CA Connect certificate directory (India, active),
# matched to NSE/BSE listings by automation/scan-asme.mjs. A successful scan
# rewrites backend/data/asme_raw.json, which drives the dashboard's
# "ASME certified" screen filter and ASME Certified list, then redeploys.
# The match against the board's own companies happens in /api/asme at
# request time, so board changes never need a re-scan.

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: asme-scan
  cancel-in-progress: false

jobs:
  scan-asme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install automation dependencies
        working-directory: ./automation
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Scan ASME directory
        working-directory: ./automation
        run: node scan-asme.mjs

      - name: Commit ASME data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/data/asme-scan.json backend/data/asme_raw.json
          if git diff --cached --quiet; then
            echo "No ASME changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "ASME certification scan"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to AWS
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "AWS_HOST/AWS_SSH_KEY secrets not set; skipping AWS deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
            "cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && docker compose up -d --build"
          echo "AWS deploy triggered"
