name: Product index (Indian beneficiaries)

# What every listed Indian company says it makes, from each company's public screener.in page --
# the index behind "Indian beneficiaries" on the News Channel (backend/app/beneficiaries.py matches
# a headline's product against it). scripts/run_product_index.py looks up ~1,200 companies a run,
# so the ~4,300 in the chart job's universe fill in over about four daily runs; after that a run
# only refreshes when 150+ companies have gone stale (About text rarely changes), so the data file
# is committed about monthly. Polite pacing (1.2 s between pages); if screener.in refuses requests
# the run stops and keeps what it has. Nothing to do by hand.

permissions:
  contents: write

on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Most companies to look up this run'
        required: false
        default: '1200'

concurrency:
  group: product-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Look up companies on screener.in
        working-directory: ./backend
        env:
          BUDGET: ${{ github.event.inputs.budget || '1200' }}
        run: python -u scripts/run_product_index.py --budget "$BUDGET"

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/product_index
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Product index update"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Data-only deploy: pull on the server and copy the new data files into the running container
      # (no rebuild, no restart); a full rebuild only if the container predates /app/sync-data.sh.
      - name: Deploy to AWS
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "AWS_HOST/AWS_SSH_KEY secrets not set; skipping AWS deploy"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${AWS_SSH_USER:-ubuntu}@$AWS_HOST" \
            "cd ${AWS_DEPLOY_PATH:-/opt/screener-app} && git pull --ff-only && (docker compose exec -T screener test -x /app/sync-data.sh && docker compose exec -T screener /app/sync-data.sh || docker compose up -d --build)"
          echo "AWS data deploy done"
