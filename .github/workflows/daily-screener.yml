name: Daily Screener Run

permissions:
  contents: write

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install automation dependencies
        working-directory: ./automation
        run: npm install --no-audit --no-fund

      - name: Run daily discovery
        working-directory: ./automation
        shell: bash
        run: |
          set +e
          node update-weekly.mjs --stamp-only
          status=$?
          echo "daily discovery exit code: $status"
          if [ "$status" -ne 0 ]; then
            echo "Daily scan reported a non-zero exit code; continuing so the repo still updates."
          fi
          exit 0

      - name: Commit data changes
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/candidates_raw.json backend/data/build_stamp.json automation/data/candidates-queue.json automation/data/reviewed-symbols.json
          if [ -d automation/data/profiles ]; then git add automation/data/profiles; fi
          if [ -f automation/data/weekly-report.md ]; then git add automation/data/weekly-report.md; fi
          if [ -f automation/data/asme-scan.json ]; then git add automation/data/asme-scan.json; fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Daily screener update"
          git push origin HEAD:${{ github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: ${{ steps.commit.outputs.changed == 'true' && secrets.RENDER_DEPLOY_HOOK != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render redeploy"
          curl -fsSL --retry 3 --retry-delay 5 -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy triggered successfully"
