name: News Channel

# China/India/USA news for the sectors each dominates globally -- see
# backend/app/news_channel.py for the two sources. The schedule below is set
# to every 5 minutes, GitHub Actions' own shortest supported interval, but
# GitHub does NOT reliably honor that in practice -- schedule: triggers are
# best-effort with no SLA and can be silently skipped under load (this repo's
# own run history showed even an hourly cron drifting to every 3-5 hours).
# Real 5-minute freshness comes from an external cron service hitting
# POST /api/cron/news-channel instead (see CRON_KEY in backend/app/config.py
# and the News Channel section of README.md) -- that calls workflow_dispatch,
# which does fire within seconds. This schedule: entry is left in place as a
# free fallback for whenever the external pinger isn't configured or is down,
# not as the primary trigger.
#
# At full 5-minute cadence (whichever trigger achieves it), newsdata.io
# would cost 288 runs x 3 requests = 864/day, well past its 200/day
# free-plan ceiling, but DAILY_CAP=180 in news_channel.py is a hard floor
# independent of how often this fires: newsdata.io simply stops being
# called once the day's 180 are used (in practice within the first few
# hours), so it can never go over regardless of schedule. Google News RSS --
# no key, no documented quota -- has no such cap and costs roughly
# 288 x 19 sector queries = ~5,500 requests/day, paced half a second apart
# within a run; if Google starts throttling at that volume, each query
# already fails independently into `errors` without breaking the run, so
# the worst case is a stale feed, not a broken one.
# Also runs on demand via "Refresh now" on the dashboard
# (POST /api/admin/news-channel/run-now) or this workflow run by hand from
# the Actions tab.
#
# Commits by this workflow use GITHUB_TOKEN, which never re-triggers
# workflows, so nothing here can loop.

permissions:
  contents: write

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: news-channel
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Fetch
        working-directory: ./backend
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: python scripts/run_news_channel.py

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/news_channel
          if git diff --cached --quiet; then
            echo "No news channel changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "News Channel update"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set; skipping deploy"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-delay 5 -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render deploy triggered"
