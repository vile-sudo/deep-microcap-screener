name: News Channel

# China/India/USA news for the sectors each dominates globally -- see
# backend/app/news_channel.py for the two sources. Runs hourly: at that
# cadence newsdata.io costs 24 x 3 = 72 requests/day (well under its
# 200/day free-plan ceiling, DAILY_CAP=180 stops it short of that
# regardless), and Google News RSS -- no key, no documented quota -- costs
# roughly 24 x 19 sector queries = ~450 requests/day, paced half a second
# apart within a run. Nothing enforces a daily ceiling on that side the way
# DAILY_CAP does for newsdata.io, since there is no published limit to
# floor under; if Google ever starts throttling it, each query already
# fails independently into `errors` without breaking the run.
# Also runs on demand via "Refresh now" on the dashboard
# (POST /api/admin/news-channel/run-now) or this workflow run by hand from
# the Actions tab.
#
# Commits by this workflow use GITHUB_TOKEN, which never re-triggers
# workflows, so nothing here can loop.

permissions:
  contents: write

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: news-channel
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Fetch
        working-directory: ./backend
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: python scripts/run_news_channel.py

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/news_channel
          if git diff --cached --quiet; then
            echo "No news channel changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "News Channel update"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set; skipping deploy"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-delay 5 -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render deploy triggered"
