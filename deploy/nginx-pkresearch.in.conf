# nginx reverse proxy for pkresearch.in -> the app container (docker-compose
# publishes it on 127.0.0.1:8000, see docker-compose.yml).
#
# Install:
#   sudo cp deploy/nginx-pkresearch.in.conf /etc/nginx/sites-available/pkresearch.in
#   sudo ln -s /etc/nginx/sites-available/pkresearch.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pkresearch.in -d www.pkresearch.in
# certbot rewrites this file in place to add the TLS (443) server block and
# the http->https redirect -- the server block below is deliberately just
# the plain-HTTP starting point it needs to find.

server {
    listen 80;
    listen [::]:80;
    server_name pkresearch.in www.pkresearch.in;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
